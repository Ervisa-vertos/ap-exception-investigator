[project]
name = "ap-exception-investigator"
version = "0.1.0"
description = "AI agent that answers 'Why is this invoice on hold?' — grounded in ERP records and AP policy."
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.22",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ap_investigator = ["erp/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
